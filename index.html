<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard + Tracker</title>

<style>
body { font-family: Arial; background:#f4f6f9; margin:0; padding:20px; }

/* Tabs */
.tabs { display:flex; justify-content:center; gap:10px; margin-bottom:15px; }
.tabs button {
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#ddd;
}
.tabs button.active { background:#1976d2; color:white; }

.tab { display:none; }
.tab.active { display:block; }

/* Your existing styles simplified */
.column { background:#fff; padding:10px; border-radius:10px; margin:10px; }
.board { display:flex; gap:10px; flex-wrap:wrap; }
.task {
  background:#fff;
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

/* Tracker */
.tracker-task {
  background:#fff;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>Task Dashboard</h2>

<div class="tabs">
  <button class="active" onclick="showTab('todoTab', this)">To-Do</button>
  <button onclick="showTab('trackerTab', this)">Time Tracker</button>
</div>

<!-- ================= TO DO TAB ================= -->
<div id="todoTab" class="tab active">

<div style="text-align:center;">
  <button id="loginBtn">Login</button>
  <button id="logoutBtn" style="display:none;">Logout</button>
</div>

<div id="taskForm" style="display:none; text-align:center; margin:10px;">
  <input id="taskInput" placeholder="Task"/>
  <button id="addTaskBtn">Add</button>
</div>

<div class="board">
  <div class="column" id="backlog"><h3>Backlog</h3></div>
  <div class="column" id="inprogress"><h3>In Progress</h3></div>
  <div class="column" id="done"><h3>Done</h3></div>
</div>

</div>

<!-- ================= TRACKER TAB ================= -->
<div id="trackerTab" class="tab">

<div style="text-align:center;">
  <input id="trackerInput" placeholder="New task"/>
  <button id="trackerAddBtn">Add</button>
</div>

<div id="trackerList"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider,
  signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.3.1/firebase-auth.js";

import {
  getFirestore, collection, addDoc,
  onSnapshot, query, where,
  deleteDoc, doc, updateDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore.js";

import { firebaseConfig } from "./config.js";

/* INIT */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* TABS */
window.showTab = (id, btn) => {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));

  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
};

/* AUTH */
loginBtn.onclick = ()=> signInWithPopup(auth,new GoogleAuthProvider());
logoutBtn.onclick = ()=> signOut(auth);

onAuthStateChanged(auth,(user)=>{
  currentUser=user;

  loginBtn.style.display=user?"none":"inline";
  logoutBtn.style.display=user?"inline":"none";
  taskForm.style.display=user?"block":"none";

  if(user){
    startTodo();
    startTracker();
  } else {
    clearTodo();
    trackerList.innerHTML="";
  }
});

/* ================= TO DO ================= */
function startTodo(){
  const q = query(collection(db,"tasks"), where("uid","==",currentUser.uid));

  onSnapshot(q,(snap)=>{
    clearTodo();

    snap.forEach(d=>{
      const t={id:d.id,...d.data()};
      renderTask(t);
    });
  });
}

function clearTodo(){
  ["backlog","inprogress","done"].forEach(id=>{
    document.getElementById(id).innerHTML=`<h3>${id}</h3>`;
  });
}

function renderTask(task){
  const col=document.getElementById(task.status||"backlog");

  const div=document.createElement("div");
  div.className="task";

  div.innerHTML=`
    <b>${task.text}</b><br/>
    <button onclick="moveTask('${task.id}','backlog')">B</button>
    <button onclick="moveTask('${task.id}','inprogress')">P</button>
    <button onclick="moveTask('${task.id}','done')">D</button>
    <button onclick="deleteTask('${task.id}')">X</button>
  `;

  col.appendChild(div);
}

window.moveTask = async (id,status)=>{
  await updateDoc(doc(db,"tasks",id),{status});
};

window.deleteTask = async (id)=>{
  await deleteDoc(doc(db,"tasks",id));
};

addTaskBtn.onclick = async ()=>{
  const text=taskInput.value.trim();
  if(!text) return;

  await addDoc(collection(db,"tasks"),{
    uid:currentUser.uid,
    text,
    status:"backlog"
  });

  taskInput.value="";
};

/* ================= TRACKER ================= */
let trackerTasks=[];

function startTracker(){
  const q = query(collection(db,"tracker"), where("uid","==",currentUser.uid));

  onSnapshot(q,(snap)=>{
    trackerTasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderTracker();
  });
}

trackerAddBtn.onclick = async ()=>{
  const name=trackerInput.value.trim();
  if(!name) return;

  await addDoc(collection(db,"tracker"),{
    uid:currentUser.uid,
    name,
    total:0,
    isActive:false,
    lastStart:null
  });

  trackerInput.value="";
};

window.startTracker = async (id)=>{
  const now=Date.now();

  const snap=await getDocs(query(collection(db,"tracker"),where("uid","==",currentUser.uid)));

  for(const d of snap.docs){
    const t=d.data();
    if(t.isActive){
      await updateDoc(doc(db,"tracker",d.id),{
        isActive:false,
        total:(t.total||0)+(now-t.lastStart)
      });
    }
  }

  await updateDoc(doc(db,"tracker",id),{
    isActive:true,
    lastStart:now
  });
};

window.stopTracker = async (task)=>{
  if(!task.isActive) return;

  const now=Date.now();

  await updateDoc(doc(db,"tracker",task.id),{
    isActive:false,
    total:(task.total||0)+(now-task.lastStart)
  });
};

function renderTracker(){
  trackerList.innerHTML="";

  trackerTasks.forEach(t=>{
    let time=t.total||0;
    if(t.isActive) time+=Date.now()-t.lastStart;

    const div=document.createElement("div");
    div.className="tracker-task";

    div.innerHTML=`
      <b>${t.name}</b>
      <div style="display:flex; justify-content:space-between;">
        <span>${formatTime(time)}</span>
        <div>
          <button onclick="startTracker('${t.id}')">▶️</button>
          <button onclick='stopTracker(${JSON.stringify(t)})'>⏹</button>
        </div>
      </div>
    `;

    trackerList.appendChild(div);
  });
}

function formatTime(ms){
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  return `${h}h ${m}m ${sec}s`;
}

setInterval(renderTracker,1000);

</script>
</body>
</html>
