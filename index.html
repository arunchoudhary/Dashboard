<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utilities Dashboard</title>
  <style>
    :root { --card:#fff; --page:#f4f6f9; --primary:#1976d2; --success:#2e7d32; --danger:#c62828; --shadow:0 2px 8px rgba(0,0,0,.09); --radius:12px; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; font-family:Arial,sans-serif; background:var(--page); color:#202124; }
    h2 { text-align:center; margin:0 0 12px; } h3 { margin:4px 0 10px; } h4 { margin:0; }
    button { border:0; border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; } button:disabled { opacity:.55; cursor:not-allowed; }
    input, select { border:1px solid #cbd0d6; border-radius:8px; padding:8px; font:inherit; min-width:0; }
    .controls, .add-task, .tracker-form { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
    .controls { margin-bottom:8px; } #loginBtn { background:#4285f4; color:#fff; } #logoutBtn { background:#ddd; }
    #userDisplay, #accessDenied { text-align:center; margin:7px 0; } #userDisplay { font-weight:bold; } #accessDenied { display:none; color:#b00020; font-weight:bold; }
    .tabs { max-width:1200px; margin:18px auto 0; display:flex; gap:8px; border-bottom:1px solid #d7dce2; }
    .tab { background:transparent; border-radius:10px 10px 0 0; color:#555; } .tab.active { background:var(--card); color:var(--primary); font-weight:bold; border:1px solid #d7dce2; border-bottom:1px solid var(--card); margin-bottom:-1px; }
    .utility { max-width:1200px; margin:auto; padding:18px 0; } .utility[hidden] { display:none; }
    .notice { text-align:center; color:#5f6368; padding:30px; }
    .add-task { margin:0 0 12px; } .add-task input { min-width:150px; } .add-task button, .tracker-form button { background:var(--success); color:#fff; }
    .board { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
    .column { background:var(--card); border-radius:var(--radius); padding:12px; width:32%; min-width:280px; flex:1 1 300px; min-height:220px; box-shadow:var(--shadow); }
    .column.dragover { background:#e9f7ff; }
    .task { background:#fff; border:1px solid #e6e6e6; border-radius:10px; box-shadow:var(--shadow); padding:10px 10px 8px; margin:10px 0; position:relative; cursor:grab; }
    .task.overdue { background:#f8d7da; } .task.due-today { background:#fff3cd; } .task:active { cursor:grabbing; }
    .task-title { font-weight:bold; padding-right:28px; word-break:break-word; } .task-meta { font-size:.85em; margin-top:4px; display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; }
    .delete-task, .delete-comment { background:var(--danger); color:#fff; padding:0 6px; line-height:20px; height:20px; font-size:.8em; }
    .delete-task { position:absolute; top:6px; right:6px; } .comments { margin-top:10px; padding-left:10px; border-left:2px solid #eee; }
    .comment { font-size:.9em; margin:4px 0; display:flex; gap:6px; align-items:center; justify-content:space-between; } .delete-comment { height:18px; line-height:18px; }
    .add-comment { display:flex; gap:6px; margin-top:6px; } .add-comment input { flex:1; } .add-comment button { background:var(--primary); color:#fff; }
    .tracker-layout { display:grid; grid-template-columns:1.5fr .9fr; gap:20px; align-items:start; }
    .panel { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
    .tracker-form { justify-content:flex-start; margin:12px 0 6px; } .tracker-form input { flex:1 1 180px; }
    .tracker-task { border-top:1px solid #e5e7eb; padding:13px 0; } .tracker-task:first-of-type { border-top:0; }
    .tracker-task-head { display:flex; gap:12px; align-items:center; justify-content:space-between; } .tracker-task-name { font-weight:bold; word-break:break-word; }
    .category { display:inline-block; margin-top:4px; padding:3px 7px; border-radius:99px; background:#e8f0fe; color:#174ea6; font-size:.8em; }
    .timer { font-variant-numeric:tabular-nums; font-size:1.25rem; font-weight:bold; white-space:nowrap; } .running-dot { color:#188038; font-size:.8rem; }
    .timer-actions, .edit-row { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; } .start-btn { background:var(--success); color:#fff; } .pause-btn { background:#f9ab00; color:#202124; } .stop-btn { background:#5f6368; color:#fff; } .edit-btn { background:#e8eaed; } .remove-btn { background:var(--danger); color:#fff; }
    .edit-row input { flex:1 1 130px; } .edit-row button { background:var(--primary); color:#fff; }
    .report-date { display:flex; gap:8px; align-items:center; margin:10px 0; } .report-date input { flex:1; }
    .report-row { display:grid; grid-template-columns:1fr auto; gap:8px; padding:10px 0; border-top:1px solid #e5e7eb; } .report-total { margin-top:12px; padding-top:12px; border-top:2px solid #d7dce2; font-weight:bold; }
    @media(max-width:768px) { body { padding:12px; } .board { flex-direction:column; } .column { width:100%; } .column#inprogress { order:-1; } .tracker-layout { grid-template-columns:1fr; } .tabs { margin-top:12px; } .add-task input, .add-task select, .add-task button, .tracker-form input, .tracker-form button { width:100%; } }
  </style>
</head>
<body>
  <h2>Utilities Dashboard</h2>
  <div class="controls"><button id="loginBtn">Sign in with Google</button><button id="logoutBtn" hidden>Logout</button></div>
  <div id="userDisplay"></div><div id="accessDenied">🚫 Access denied by Firebase security rules.</div>

  <nav class="tabs" aria-label="Utilities">
    <button class="tab active" data-tab="todo">To-Do</button>
    <button class="tab" data-tab="tracker">Time Tracker</button>
  </nav>

  <main id="todo" class="utility">
    <div class="add-task" id="taskForm" hidden>
      <input type="text" id="taskInput" placeholder="Enter new task..." /><input type="date" id="dueDateInput" title="Select due date" />
      <select id="prioritySelect"><option value="low">🟢 Low</option><option value="medium">🟠 Medium</option><option value="high">🔴 High</option></select>
      <select id="statusSelect"><option value="backlog">Backlog</option><option value="inprogress">In Progress</option><option value="done">Done</option></select><button id="addTaskBtn">Add Task</button>
    </div>
    <div class="board"><div class="column" id="backlog"><h3>Backlog</h3></div><div class="column" id="inprogress"><h3>In Progress</h3></div><div class="column" id="done"><h3>Done</h3></div></div>
  </main>

  <main id="tracker" class="utility" hidden>
    <div id="trackerSignedOut" class="notice">Sign in to track and report your time.</div>
    <div id="trackerContent" hidden class="tracker-layout">
      <section class="panel"><h3>Time Tracker</h3><p>Start a task, pause when needed, then stop it when finished.</p>
        <div class="tracker-form"><input id="timerTaskInput" placeholder="Task name" /><input id="timerCategoryInput" placeholder="Category (e.g. Project A)" /><button id="addTimerTaskBtn">Add task</button></div>
        <div id="timerTasks"></div>
      </section>
      <aside class="panel"><h3>Daily report</h3><div class="report-date"><label for="reportDate">Date</label><input type="date" id="reportDate" /></div><div id="categoryReport"></div></aside>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, updateDoc, getDoc, arrayUnion, writeBatch } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore.js";
    import { firebaseConfig } from "./config.js";
    const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
    let currentUser=null, unsubscribeTasks=null, unsubscribeTimers=null, unsubscribeEntries=null, timerTasks=[];
    const $=id=>document.getElementById(id), columns=["backlog","inprogress","done"];
    const loginBtn=$("loginBtn"), logoutBtn=$("logoutBtn"), taskForm=$("taskForm"), accessDenied=$("accessDenied");
    $("reportDate").value=localDate();
    document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{ document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===btn)); ["todo","tracker"].forEach(id=>$(id).hidden=id!==btn.dataset.tab); });
    columns.forEach(id=>{ const col=$(id); col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("dragover")});col.addEventListener("dragleave",()=>col.classList.remove("dragover"));col.addEventListener("drop",e=>handleDrop(e,id)); });
    loginBtn.onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()); logoutBtn.onclick=()=>signOut(auth);
    onAuthStateChanged(auth,user=>{ stopStreams(); currentUser=user||null; if(user){ loginBtn.hidden=true; logoutBtn.hidden=false; taskForm.hidden=false; $("userDisplay").textContent=`Welcome, ${user.displayName||user.email}`; $("trackerSignedOut").hidden=true; $("trackerContent").hidden=false; accessDenied.style.display="none"; startStreams(); } else { loginBtn.hidden=false;logoutBtn.hidden=true;taskForm.hidden=true;$("userDisplay").textContent="";$("trackerSignedOut").hidden=false;$("trackerContent").hidden=true;clearColumns();$("timerTasks").innerHTML="";$("categoryReport").innerHTML=""; } });
    function stopStreams(){ [unsubscribeTasks,unsubscribeTimers,unsubscribeEntries].forEach(fn=>fn&&fn()); unsubscribeTasks=unsubscribeTimers=unsubscribeEntries=null; }
    function fail(err){ console.error(err); accessDenied.style.display="block"; }
    function startStreams(){
      unsubscribeTasks=onSnapshot(query(collection(db,"tasks"),where("uid","==",currentUser.uid)),snap=>{ clearColumns(); const tasks=[];snap.forEach(d=>tasks.push({id:d.id,...d.data()}));tasks.sort(todoSort);tasks.forEach(t=>renderTask(t.id,t)); },fail);
      unsubscribeTimers=onSnapshot(query(collection(db,"timeTrackerTasks"),where("uid","==",currentUser.uid)),snap=>{timerTasks=[];snap.forEach(d=>timerTasks.push({id:d.id,...d.data()}));timerTasks.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));renderTimerTasks();},fail);
      streamReport();
    }
    function streamReport(){ if(unsubscribeEntries)unsubscribeEntries(); if(!currentUser)return; const day=$("reportDate").value; unsubscribeEntries=onSnapshot(query(collection(db,"timeEntries"),where("uid","==",currentUser.uid)),snap=>renderReport([...snap.docs].map(d=>d.data()).filter(entry=>entry.date===day)),fail); }
    $("reportDate").onchange=streamReport;
    function todoSort(a,b){const order={high:0,medium:1,low:2};const p=(order[a.priority]??2)-(order[b.priority]??2);if(p)return p;return (a.dueDate||"9999").localeCompare(b.dueDate||"9999");}
    function clearColumns(){columns.forEach(id=>$(id).innerHTML=`<h3>${id==="inprogress"?"In Progress":id[0].toUpperCase()+id.slice(1)}</h3>`);}
    function renderTask(id,task){const card=document.createElement("div");card.className="task";card.draggable=true;card.dataset.id=id;card.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",id));const due=task.dueDate;if(due){const today=localDate();if(due<today)card.classList.add("overdue");else if(due===today)card.classList.add("due-today");}card.innerHTML=`<button class="delete-task">×</button><div class="task-title">${esc(task.text||"")}</div><div class="task-meta">Due: <input class="task-due" type="date" value="${due||""}"> Priority: <select class="task-priority"><option value="low" ${task.priority==="low"?"selected":""}>Low</option><option value="medium" ${task.priority==="medium"?"selected":""}>Medium</option><option value="high" ${task.priority==="high"?"selected":""}>High</option></select></div><div class="comments"></div><div class="add-comment"><input placeholder="Add comment..."><button>Add</button></div>`;card.querySelector(".delete-task").onclick=()=>deleteDoc(doc(db,"tasks",id)).catch(fail);card.querySelector(".task-due").onchange=e=>updateDoc(doc(db,"tasks",id),{dueDate:e.target.value||null}).catch(fail);card.querySelector(".task-priority").onchange=e=>updateDoc(doc(db,"tasks",id),{priority:e.target.value}).catch(fail);const wrap=card.querySelector(".comments");(task.comments||[]).forEach((c,i)=>{const row=document.createElement("div");row.className="comment";row.innerHTML=`<span>${esc(c)}</span><button class="delete-comment">×</button>`;row.querySelector("button").onclick=()=>removeComment(id,i);wrap.appendChild(row)});const input=card.querySelector(".add-comment input");card.querySelector(".add-comment button").onclick=()=>{const text=input.value.trim();if(text)updateDoc(doc(db,"tasks",id),{comments:arrayUnion(text)}).catch(fail);input.value=""};($(task.status)||$("backlog")).appendChild(card);}
    $("addTaskBtn").onclick=()=>{const text=$("taskInput").value.trim();if(!text||!currentUser)return;addDoc(collection(db,"tasks"),{uid:currentUser.uid,text,status:$("statusSelect").value,dueDate:$("dueDateInput").value||null,priority:$("prioritySelect").value,comments:[]}).then(()=>{$("taskInput").value="";$("dueDateInput").value=""}).catch(fail);};
    async function removeComment(id,index){try{const ref=doc(db,"tasks",id), snap=await getDoc(ref), comments=[...(snap.data().comments||[])];comments.splice(index,1);await updateDoc(ref,{comments});}catch(e){fail(e)}}
    function handleDrop(e,status){e.preventDefault();e.currentTarget.classList.remove("dragover");const id=e.dataTransfer.getData("text/plain");if(id)updateDoc(doc(db,"tasks",id),{status}).catch(fail);}
    $("addTimerTaskBtn").onclick=()=>{const name=$("timerTaskInput").value.trim(),category=$("timerCategoryInput").value.trim();if(!name||!category||!currentUser)return;addDoc(collection(db,"timeTrackerTasks"),{uid:currentUser.uid,name,category,elapsedMs:0,running:false,activeSince:null,createdAt:Date.now()}).then(()=>{$("timerTaskInput").value="";$("timerCategoryInput").value=""}).catch(fail);};
    function renderTimerTasks(){const wrap=$("timerTasks");wrap.innerHTML="";if(!timerTasks.length){wrap.innerHTML='<p class="notice">No tracked tasks yet.</p>';return;}timerTasks.forEach(task=>{const row=document.createElement("article");row.className="tracker-task";row.dataset.id=task.id;row.innerHTML=`<div class="tracker-task-head"><div><div class="tracker-task-name">${esc(task.name)}</div><span class="category">${esc(task.category)}</span></div><div class="timer">${formatMs(currentElapsed(task))} ${task.running?'<span class="running-dot">●</span>':''}</div></div><div class="timer-actions"><button class="start-btn">${task.running?"Running":"Start / resume"}</button><button class="pause-btn">Pause</button><button class="stop-btn">Stop</button><button class="edit-btn">Edit</button><button class="remove-btn">Delete</button></div><div class="edit-row" hidden><input class="edit-name" value="${escAttr(task.name)}"><input class="edit-category" value="${escAttr(task.category)}"><button class="save-edit">Save</button></div>`;const buttons=row.querySelectorAll(".timer-actions button");buttons[0].disabled=!!task.running;buttons[1].disabled=!task.running;buttons[2].disabled=!task.running;buttons[0].onclick=()=>startTimer(task);buttons[1].onclick=()=>pauseTimer(task);buttons[2].onclick=()=>stopTimer(task);buttons[3].onclick=()=>row.querySelector(".edit-row").hidden=!row.querySelector(".edit-row").hidden;buttons[4].onclick=()=>{if(confirm(`Delete “${task.name}”?`))deleteDoc(doc(db,"timeTrackerTasks",task.id)).catch(fail);};row.querySelector(".save-edit").onclick=()=>{const name=row.querySelector(".edit-name").value.trim(),category=row.querySelector(".edit-category").value.trim();if(name&&category)updateDoc(doc(db,"timeTrackerTasks",task.id),{name,category}).catch(fail);};wrap.appendChild(row);});}
    function currentElapsed(t){return (t.elapsedMs||0)+(t.running?Math.max(0,Date.now()-t.activeSince):0);}
    async function startTimer(t){try{await updateDoc(doc(db,"timeTrackerTasks",t.id),{running:true,activeSince:Date.now()});}catch(e){fail(e)}}
    async function pauseTimer(t){try{const now=Date.now(),duration=Math.max(0,now-t.activeSince),batch=writeBatch(db);batch.set(doc(collection(db,"timeEntries")),{uid:currentUser.uid,taskId:t.id,category:t.category,startedAt:t.activeSince,durationMs:duration,date:localDate(new Date(t.activeSince))});batch.update(doc(db,"timeTrackerTasks",t.id),{elapsedMs:(t.elapsedMs||0)+duration,running:false,activeSince:null});await batch.commit();}catch(e){fail(e)}}
    async function stopTimer(t){await pauseTimer(t);}
    function renderReport(entries){const totals={};entries.forEach(e=>totals[e.category]=(totals[e.category]||0)+(e.durationMs||0));const items=Object.entries(totals).sort((a,b)=>b[1]-a[1]),total=items.reduce((sum,[,ms])=>sum+ms,0);$("categoryReport").innerHTML=items.length?items.map(([category,ms])=>`<div class="report-row"><span>${esc(category)}</span><strong>${formatMs(ms)}</strong></div>`).join("")+`<div class="report-total">Total <span style="float:right">${formatMs(total)}</span></div>`:'<p class="notice">No recorded time for this day.</p>';}
    setInterval(()=>{document.querySelectorAll(".tracker-task").forEach(row=>{const t=timerTasks.find(x=>x.id===row.dataset.id);const display=row.querySelector(".timer");if(t&&t.running)display.childNodes[0].textContent=formatMs(currentElapsed(t))+" ";});},1000);
    function localDate(date=new Date()){const offset=date.getTimezoneOffset()*60000;return new Date(date-offset).toISOString().slice(0,10);} function formatMs(ms){const sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");} function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));} function escAttr(s=""){return esc(s);}
  </script>
</body>
</html>
