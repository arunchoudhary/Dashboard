<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do Dashboard + Tracker</title>

  <style>
    :root{
      --card-bg:#fff;
      --page-bg:#f4f6f9;
      --shadow:0 2px 6px rgba(0,0,0,.08);
      --radius:12px;
    }
    *{box-sizing:border-box}
    body{
      font-family: Arial, sans-serif;
      background: var(--page-bg);
      padding: 20px; margin:0;
    }
    h2{ text-align:center; margin:0 0 12px }

    /* ===== NEW: TABS ===== */
    .tabs {
      display:flex;
      justify-content:center;
      gap:10px;
      margin-bottom:15px;
    }
    .tabs button {
      padding:10px 16px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      box-shadow:var(--shadow);
      background:#ddd;
    }
    .tabs button.active {
      background:#1976d2;
      color:#fff;
    }
    .tab { display:none; }
    .tab.active { display:block; }

    /* ===== EXISTING STYLES (UNCHANGED) ===== */
    .controls{
      display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:8px;
    }
    .board{
      display:flex; gap:20px; margin-top:16px; flex-wrap:wrap; align-items:flex-start;
    }
    .column{
      background:var(--card-bg); border-radius:var(--radius); padding:12px;
      width:32%; min-width:280px; flex:1 1 300px; min-height:220px; box-shadow:var(--shadow);
    }
    .column h3{ margin:4px 0 8px; font-size:1.05rem }
    .task{
      background:#fff; border:1px solid #e6e6e6; border-radius:10px;
      box-shadow:var(--shadow); padding:10px; margin:10px 0;
    }

    /* ===== NEW: TRACKER ===== */
    .tracker-task{
      background:#fff;
      border:1px solid #e6e6e6;
      border-radius:10px;
      box-shadow:var(--shadow);
      padding:10px;
      margin:10px 0;
    }
  </style>
</head>

<body>

<h2>Task Dashboard</h2>

<!-- ===== TABS ===== -->
<div class="tabs">
  <button class="active" onclick="showTab('todoTab', this)">To-Do</button>
  <button onclick="showTab('trackerTab', this)">Time Tracker</button>
</div>

<!-- ================= TO DO (UNCHANGED LOGIC) ================= -->
<div id="todoTab" class="tab active">

  <div class="controls">
    <button id="loginBtn">Sign in with Google</button>
    <button id="logoutBtn" style="display:none;">Logout</button>
  </div>

  <div id="taskForm" style="display:none; text-align:center; margin:10px;">
    <input id="taskInput" placeholder="Task"/>
    <button id="addTaskBtn">Add</button>
  </div>

  <div class="board">
    <div class="column" id="backlog"><h3>Backlog</h3></div>
    <div class="column" id="inprogress"><h3>In Progress</h3></div>
    <div class="column" id="done"><h3>Done</h3></div>
  </div>

</div>

<!-- ================= TRACKER ================= -->
<div id="trackerTab" class="tab">
  <h3 style="text-align:center;">Time Tracker</h3>

  <div style="text-align:center; margin-bottom:12px;">
    <input id="trackerInput" placeholder="New tracker task..." />
    <button id="trackerAddBtn">Add</button>
  </div>

  <div id="trackerList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider,
  signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.3.1/firebase-auth.js";

import {
  getFirestore, collection, addDoc,
  onSnapshot, query, where,
  deleteDoc, doc, updateDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore.js";

import { firebaseConfig } from "./config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* ===== TABS ===== */
window.showTab = (id, btn) => {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
};

/* ===== AUTH ===== */
loginBtn.onclick = () => signInWithPopup(auth,new GoogleAuthProvider());
logoutBtn.onclick = () => signOut(auth);

/* ===== TODO (MINIMAL, SAFE) ===== */
onAuthStateChanged(auth,(user)=>{
  currentUser=user;

  loginBtn.style.display=user?"none":"inline";
  logoutBtn.style.display=user?"inline":"none";
  taskForm.style.display=user?"block":"none";

  if(user){
    startTodo();
    startTracker();
  }
});

function startTodo(){
  const q=query(collection(db,"tasks"),where("uid","==",currentUser.uid));

  onSnapshot(q,(snap)=>{
    ["backlog","inprogress","done"].forEach(id=>{
      document.getElementById(id).innerHTML=`<h3>${id}</h3>`;
    });

    snap.forEach(d=>{
      const t={id:d.id,...d.data()};
      renderTask(t);
    });
  });
}

function renderTask(t){
  const col=document.getElementById(t.status||"backlog");

  const div=document.createElement("div");
  div.className="task";
  div.innerHTML=`
    <b>${t.text}</b><br/>
    <button onclick="moveTask('${t.id}','backlog')">B</button>
    <button onclick="moveTask('${t.id}','inprogress')">P</button>
    <button onclick="moveTask('${t.id}','done')">D</button>
    <button onclick="deleteTask('${t.id}')">X</button>
  `;

  col.appendChild(div);
}

window.moveTask=(id,s)=>updateDoc(doc(db,"tasks",id),{status:s});
window.deleteTask=(id)=>deleteDoc(doc(db,"tasks",id));

addTaskBtn.onclick=async()=>{
  const text=taskInput.value.trim();
  if(!text) return;

  await addDoc(collection(db,"tasks"),{
    uid:currentUser.uid,
    text,
    status:"backlog"
  });

  taskInput.value="";
};

/* ===== TRACKER ===== */
let trackerTasks=[];

function startTracker(){
  const q=query(collection(db,"tracker"),where("uid","==",currentUser.uid));

  onSnapshot(q,(snap)=>{
    trackerTasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderTracker();
  });
}

trackerAddBtn.onclick=async()=>{
  const name=trackerInput.value.trim();
  if(!name) return;

  await addDoc(collection(db,"tracker"),{
    uid:currentUser.uid,
    name,
    total:0,
    isActive:false,
    lastStart:null
  });

  trackerInput.value="";
};

window.startTracker=async(id)=>{
  const now=Date.now();

  const snap=await getDocs(query(collection(db,"tracker"),where("uid","==",currentUser.uid)));

  for(const d of snap.docs){
    const t=d.data();
    if(t.isActive){
      await updateDoc(doc(db,"tracker",d.id),{
        isActive:false,
        total:(t.total||0)+(now-t.lastStart)
      });
    }
  }

  await updateDoc(doc(db,"tracker",id),{
    isActive:true,
    lastStart:now
  });
};

window.stopTracker=async(id)=>{
  const t=trackerTasks.find(x=>x.id===id);
  if(!t||!t.isActive) return;

  const now=Date.now();

  await updateDoc(doc(db,"tracker",id),{
    isActive:false,
    total:(t.total||0)+(now-t.lastStart)
  });
};

function renderTracker(){
  trackerList.innerHTML="";

  trackerTasks.forEach(t=>{
    let time=t.total||0;
    if(t.isActive) time+=Date.now()-t.lastStart;

    const div=document.createElement("div");
    div.className="tracker-task";

    div.innerHTML=`
      <strong>${t.name}</strong>
      <div style="display:flex;justify-content:space-between;margin-top:8px;">
        <span>${formatTime(time)}</span>
        <div>
          <button onclick="startTracker('${t.id}')">▶️</button>
          <button onclick="stopTracker('${t.id}')">⏹</button>
        </div>
      </div>
    `;

    trackerList.appendChild(div);
  });
}

function formatTime(ms){
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  return `${h}h ${m}m ${sec}s`;
}

setInterval(renderTracker,1000);

</script>
</body>
</html>
