<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard + Time Tracker</title>

<style>
body { font-family: Arial; margin:0; background:#f4f6f9; }
h2 { text-align:center; }

.tabs {
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px;
}
.tabs button {
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#ddd;
}
.tabs button.active { background:#1976d2; color:#fff; }

.tab { display:none; padding:10px; }
.tab.active { display:block; }

/* reuse your styles (shortened) */
.column { background:#fff; padding:10px; border-radius:10px; margin:10px; flex:1; }
.board { display:flex; gap:10px; flex-wrap:wrap; }

.task {
  background:#fff;
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

/* timer */
.task-timer {
  display:flex;
  justify-content:space-between;
  margin-top:6px;
}
.task-timer button {
  border:none;
  padding:4px 8px;
  border-radius:6px;
  cursor:pointer;
}
.start-btn { background:#2e7d32; color:#fff; }
.stop-btn { background:#c62828; color:#fff; }

</style>
</head>

<body>

<h2>Productivity Dashboard</h2>

<div class="tabs">
  <button class="active" onclick="showTab('todo')">To-Do</button>
  <button onclick="showTab('tracker')">Time Tracker</button>
</div>

<!-- ================= TO DO TAB ================= -->
<div id="todo" class="tab active">

<div style="text-align:center;">
  <button id="loginBtn">Login</button>
  <button id="logoutBtn" style="display:none;">Logout</button>
</div>

<div id="taskForm" style="display:none; text-align:center; margin:10px;">
  <input id="taskInput" placeholder="Task"/>
  <button id="addTaskBtn">Add</button>
</div>

<div class="board">
  <div class="column" id="backlog"><h3>Backlog</h3></div>
  <div class="column" id="inprogress"><h3>In Progress</h3></div>
  <div class="column" id="done"><h3>Done</h3></div>
</div>

</div>

<!-- ================= TRACKER TAB ================= -->
<div id="tracker" class="tab">

<div style="text-align:center;">
  <input id="trackerInput" placeholder="New task"/>
  <button onclick="tracker.add()">Add</button>
</div>

<div id="trackerList"></div>

</div>

<!-- ================= SCRIPT ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider,
  signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.3.1/firebase-auth.js";

import {
  getFirestore, collection, addDoc,
  onSnapshot, query, where,
  deleteDoc, doc, updateDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore.js";

import { firebaseConfig } from "./config.js";

/* ================= INIT ================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;

/* ================= TABS ================= */
window.showTab = (id) => {
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  event.target.classList.add("active");
};

/* ================= AUTH ================= */
loginBtn.onclick = ()=> signInWithPopup(auth,new GoogleAuthProvider());
logoutBtn.onclick = ()=> signOut(auth);

onAuthStateChanged(auth,(u)=>{
  user=u;
  loginBtn.style.display=u?"none":"inline";
  logoutBtn.style.display=u?"inline":"none";
  taskForm.style.display=u?"block":"none";

  if(u){
    todo.init();
    tracker.init();
  }
});

/* =====================================================
   🧩 MODULE 1: TO DO (your existing simplified logic)
===================================================== */
const todo = (()=>{

let unsub=null;

function init(){
  if(unsub) unsub();

  const q = query(collection(db,"tasks"), where("uid","==",user.uid));
  unsub = onSnapshot(q,(snap)=>{
    ["backlog","inprogress","done"].forEach(id=>{
      document.getElementById(id).innerHTML=`<h3>${id}</h3>`;
    });

    snap.forEach(d=>{
      const t={id:d.id,...d.data()};
      render(t);
    });
  });
}

function render(task){
  const col=document.getElementById(task.status||"backlog");

  const div=document.createElement("div");
  div.className="task";

  div.innerHTML=`
    <b>${task.text}</b>
    <br/>
    <button onclick="todo.move('${task.id}','backlog')">B</button>
    <button onclick="todo.move('${task.id}','inprogress')">P</button>
    <button onclick="todo.move('${task.id}','done')">D</button>
    <button onclick="todo.del('${task.id}')">X</button>
  `;

  col.appendChild(div);
}

async function add(){
  const text=taskInput.value.trim();
  if(!text) return;

  await addDoc(collection(db,"tasks"),{
    uid:user.uid,
    text,
    status:"backlog"
  });

  taskInput.value="";
}

async function move(id,status){
  await updateDoc(doc(db,"tasks",id),{status});
}

async function del(id){
  await deleteDoc(doc(db,"tasks",id));
}

addTaskBtn.onclick=add;

return { init, move, del };

})();

/* =====================================================
   🧩 MODULE 2: TIME TRACKER (clean reusable)
===================================================== */
const tracker = (()=>{

let tasks=[];

function init(){
  const q=query(collection(db,"tracker"),where("uid","==",user.uid));

  onSnapshot(q,(snap)=>{
    tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
}

async function add(){
  const name=document.getElementById("trackerInput").value.trim();
  if(!name) return;

  await addDoc(collection(db,"tracker"),{
    uid:user.uid,
    name,
    total:0,
    isActive:false,
    lastStart:null
  });

  trackerInput.value="";
}

async function start(id){
  const now=Date.now();

  const snap=await getDocs(query(collection(db,"tracker"),where("uid","==",user.uid)));

  for(const d of snap.docs){
    const t=d.data();
    if(t.isActive){
      await updateDoc(doc(db,"tracker",d.id),{
        isActive:false,
        total:(t.total||0)+(now-t.lastStart)
      });
    }
  }

  await updateDoc(doc(db,"tracker",id),{
    isActive:true,
    lastStart:now
  });
}

async function stop(t){
  if(!t.isActive) return;

  const now=Date.now();

  await updateDoc(doc(db,"tracker",t.id),{
    isActive:false,
    total:(t.total||0)+(now-t.lastStart)
  });
}

function render(){
  const el=document.getElementById("trackerList");
  el.innerHTML="";

  tasks.forEach(t=>{
    const div=document.createElement("div");
    div.className="task";

    const time = calc(t);

    div.innerHTML=`
      <b>${t.name}</b>
      <div class="task-timer">
        <span>${format(time)}</span>
        <div>
          <button class="start-btn">▶️</button>
          <button class="stop-btn">⏹</button>
        </div>
      </div>
    `;

    div.querySelector(".start-btn").onclick=()=>start(t.id);
    div.querySelector(".stop-btn").onclick=()=>stop(t);

    el.appendChild(div);
  });
}

function calc(t){
  let time=t.total||0;
  if(t.isActive) time+=Date.now()-t.lastStart;
  return time;
}

function format(ms){
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  return `${h}h ${m}m ${sec}s`;
}

setInterval(render,1000);

return { init, add };

})();

</script>
</body>
</html>
